<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Twisted Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1a1410;
    --panel: rgba(28, 20, 15, 0.82);
    --ink: #f3e6d0;
    --muted: #b9a58a;
    --rust: #c4501c;
    --sand: #e3b25f;
    --hp: #d8432a;
    --nitro: #4ea6e8;
    --heat: #e8a33a;
    --line: rgba(243, 230, 208, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1a1410; }
  }
  :root[data-theme="dark"] { --bg: #1a1410; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Russo One', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }

  #hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; gap: 8px; align-items: flex-start; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--muted); }
  .chip b { display: block; color: var(--ink); font-size: 22px; font-weight: 400; line-height: 1.1; }
  #minimap { margin-left: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: 132px; height: 132px; }
  .bottom { position: absolute; left: 16px; bottom: max(14px, env(safe-area-inset-bottom)); width: min(320px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin: 4px 0; }
  .row span { width: 54px; }
  .bar { flex: 1; height: 10px; background: rgba(255,255,255,0.08); border-radius: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; transition: width .1s; }
  #hp { background: var(--hp); } #hp.low { animation: blink .4s infinite alternate; }
  #heat { background: var(--heat); } #heat.over { background: #ff2a10; }
  #nitro { background: var(--nitro); opacity: .55; } #nitro.ready { opacity: 1; }
  #weapon { color: var(--sand); font-size: 15px; }
  @keyframes blink { to { opacity: .35; } }
  .mute-wrap { position: absolute; right: 16px; top: calc(max(12px, env(safe-area-inset-top)) + 140px); }
  #mute, #quit { pointer-events: auto; display: block; margin-bottom: 6px; font-family: inherit; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
  @media (max-width: 600px) { .mute-wrap { top: calc(max(12px, env(safe-area-inset-top)) + 104px); } }
  #feed { position: absolute; top: 90px; left: 16px; font-size: 14px; text-shadow: 0 1px 2px #000; }
  #feed div { margin: 2px 0; } #feed .hl { color: var(--sand); }
  #countdown { position: absolute; inset: 0; display: grid; place-items: center; font-size: 96px; color: var(--sand); text-shadow: 0 4px 0 #5a2a10, 0 0 30px rgba(0,0,0,.5); }
  #toast { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); font-size: 28px; color: var(--sand); text-shadow: 0 2px 0 #000; }
  #dead { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-size: 22px; color: var(--hp); text-shadow: 0 2px 0 #000; white-space: nowrap; }

  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 12, 8, 0.6); padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; text-align: center; backdrop-filter: blur(4px); }
  h1 { margin: 0 0 4px; font-size: clamp(34px, 9vw, 52px); font-weight: 400; color: var(--sand); letter-spacing: 1px; text-shadow: 0 3px 0 #6a2a10; }
  h2 { margin: 0 0 12px; font-weight: 400; color: var(--sand); }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .keys { text-align: left; font-size: 14px; color: var(--muted); margin: 16px 0; line-height: 1.8; }
  kbd { background: rgba(255,255,255,0.1); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink); font-family: inherit; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 15px; }
  td, th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; }
  tr.me td { color: var(--sand); }
    .car { font-family: inherit; text-align: left; color: var(--ink); background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-left: 6px solid var(--car); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
  .car b { font-weight: 400; font-size: 15px; }
  .car small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; margin-bottom: 2px; }
  .car.on { border-color: var(--sand); border-left-color: var(--car); background: rgba(227,178,95,0.12); }
  .car:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .stat span { width: 58px; }
  .stat i { flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--sand) var(--v), rgba(255,255,255,0.1) var(--v)); }

  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  h3 { margin: 14px 0 6px; font-weight: 400; font-size: 14px; color: var(--muted); text-align: left; letter-spacing: .5px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .head h2 { margin: 0; }
  .back, .btn2 { font-family: inherit; font-size: 14px; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .back { padding: 6px 10px; font-size: 12px; }
  .btn2.danger { color: var(--muted); font-size: 12px; }
  .go.sm, .btn2.sm { font-size: 13px; padding: 8px 12px; margin: 0; box-shadow: none; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .menu { display: grid; gap: 10px; margin: 16px 0; }
  .big { font-family: inherit; font-size: 22px; color: #fff; background: var(--rust); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; box-shadow: 0 4px 0 #6a2a10; display: grid; gap: 2px; }
  .big.alt { background: rgba(255,255,255,0.08); box-shadow: 0 4px 0 rgba(0,0,0,0.35); color: var(--ink); }
  .big small { font-size: 12px; font-family: system-ui, sans-serif; opacity: .8; }
  .ver { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  .gang, .trk, .car { font-family: inherit; text-align: left; color: var(--ink); background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
  .gang, .car { border-left: 6px solid var(--car); }
  .gang b, .trk b, .car b { font-weight: 400; font-size: 15px; }
  .gang small, .trk small, .car small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .gang em { color: var(--sand); font-size: 11px; font-family: system-ui, sans-serif; }
  .trk.on, .car.on { border-color: var(--sand); background: rgba(227,178,95,0.12); }
  .car.on { border-left-color: var(--car); }
  .gang:hover, .trk:hover, .car:hover { background: rgba(255,255,255,0.08); }
  .gang:focus-visible, .trk:focus-visible, .car:focus-visible, .big:focus-visible, .go:focus-visible, .btn2:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
  .quote { margin: 12px 0; text-align: left; background: rgba(255,255,255,0.05); border-left: 3px solid var(--sand); border-radius: 0 8px 8px 0; padding: 10px 12px; }
  .quote blockquote { margin: 0; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .quote figcaption { margin-top: 4px; font-size: 12px; color: var(--sand); }
  .bank { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); margin: 6px 0; }
  .bank b { color: var(--ink); font-weight: 400; font-size: 16px; margin-left: 4px; }
  .terrs, .upgs { display: grid; gap: 8px; margin-top: 10px; text-align: left; }
  .terr, .upg { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-left: 6px solid var(--car, var(--sand)); border-radius: 10px; padding: 8px 10px; }
  .terr > div, .upg > div { min-width: 0; display: grid; gap: 2px; }
  .terr b, .upg b { font-weight: 400; font-size: 15px; }
  .terr small, .upg small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .terr.final { border-color: var(--sand); }
  .pips { display: flex; gap: 4px; margin-top: 2px; }
  .pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); }
  .pips i.boss { width: 22px; }
  .pips i.done { background: var(--sand); }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; font-family: system-ui, sans-serif; vertical-align: 2px; }
  .tag.ok { background: #3c6a2c; color: #e8f5d8; }
  .tag.bad { background: #5a4a40; color: #e8d8c8; }
  .tag.warn { background: #b0301a; color: #fff; }
  .warn-text { color: #ff9a70; font-size: 13px; font-family: system-ui, sans-serif; }
  .small { font-size: 12px; }
  .opp { list-style: none; padding: 0; margin: 0; text-align: left; display: grid; gap: 4px; font-size: 14px; }
  .opp small { color: var(--muted); font-family: system-ui, sans-serif; font-size: 11px; margin-left: 4px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .tbl { overflow-x: auto; }
  .fuel { display: grid; gap: 2px; margin: 10px auto; max-width: 280px; font-size: 13px; color: var(--muted); }
  .fuel div { display: flex; justify-content: space-between; }
  .fuel b { color: var(--sand); font-weight: 400; font-variant-numeric: tabular-nums; }
  .fuel .sum { border-top: 1px solid var(--line); padding-top: 4px; color: var(--ink); }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } .terr, .upg { flex-wrap: wrap; } }
  .keys { margin: 10px 0; }
  @media (max-width: 420px) { .card { padding: 14px; } .keys { display: none; } }
  @media (max-height: 800px) { .keys { font-size: 12px; line-height: 1.55; margin: 6px 0; } h1 { font-size: 36px; } .card .muted { margin: 4px 0; } }
  .go { margin-top: 8px; font-family: inherit; font-size: 22px; padding: 12px 36px; border: 0; border-radius: 10px; background: var(--rust); color: #fff; cursor: pointer; box-shadow: 0 4px 0 #6a2a10; }
  .go:active { transform: translateY(2px); box-shadow: 0 2px 0 #6a2a10; }

  body:has(#overlay:not([hidden])) #touch { display: none; }
  #touch { position: fixed; inset: 0; pointer-events: none; }
  /* Левый палец: стик появляется там, где коснулся */
  #stick-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 72%; pointer-events: auto; touch-action: none; }
  #stick { position: absolute; left: calc(max(20px, env(safe-area-inset-left)) + 60px); top: calc(100% - max(20px, env(safe-area-inset-bottom)) - 60px);
    width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid var(--line); background: rgba(28, 20, 15, 0.35); opacity: .7; }
  #stick::before, #stick::after { content: '◀'; position: absolute; top: 50%; left: 8px; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  #stick::after { content: '▶'; left: auto; right: 8px; }
  #stick-knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--panel); border: 2px solid var(--sand); box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  #stick-zone .hint { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: calc(max(20px, env(safe-area-inset-bottom)) + 126px); font-size: 11px; color: var(--ink); opacity: .75; text-shadow: 0 1px 2px #000; }
  #stick-zone.active .hint { display: none; }
  #stick-zone.active #stick { opacity: 1; }
  #stick-zone.braking #stick-knob { border-color: var(--hp); background: rgba(216, 67, 42, 0.55); }
  /* Правый палец: большой ОГОНЬ в углу, остальное по дуге вокруг */
  #touch .fire-pad { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 200px; height: 200px; }
  #touch .fire-pad button { pointer-events: auto; position: absolute; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--ink);
    font-family: inherit; font-size: 11px; line-height: 1.15; touch-action: none; padding: 0; }
  #touch .fire-pad .fire { right: 0; bottom: 0; width: 112px; height: 112px; font-size: 16px; border-color: var(--rust); background: rgba(196, 80, 28, 0.55); }
  #touch .fire-pad .alt { right: 120px; bottom: 6px; width: 72px; height: 72px; }
  #touch .fire-pad .nitro { right: 22px; bottom: 120px; width: 72px; height: 72px; }
  #touch .fire-pad .alt.empty { opacity: .45; }
  #touch .fire-pad .nitro.ready { border-color: var(--nitro); box-shadow: 0 0 12px var(--nitro); }
  #touch .fire-pad button.down { background: var(--rust); border-color: var(--sand); }
  #touch .fire-pad .nitro.down { background: var(--nitro); }
  body.touch .bottom { top: calc(max(12px, env(safe-area-inset-top)) + 64px); bottom: auto; width: 190px; padding: 6px 10px; }
  body.touch .row { margin: 2px 0; font-size: 11px; }
  body.touch #feed { top: 210px; }
  @media (max-width: 600px) {
    .top { gap: 5px; left: 10px; right: 10px; }
    .chip { padding: 4px 7px; font-size: 11px; }
    .chip b { font-size: 17px; }
    #minimap { width: 96px; height: 96px; }
  }
  .card { touch-action: pan-y; }
  body.touch .keys { display: none; }
  /* Телефон в альбомной ориентации: экран низкий, интерфейс ужимаем, чтобы было видно трассу */
  @media (max-height: 500px) {
    .top { top: max(6px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); gap: 4px; }
    .chip { padding: 2px 6px; font-size: 9px; border-radius: 6px; }
    .chip b { font-size: 14px; }
    #minimap { width: 76px; height: 76px; }
    .bottom, body.touch .bottom { top: calc(max(6px, env(safe-area-inset-top)) + 40px); bottom: auto; left: max(8px, env(safe-area-inset-left)); width: 140px; padding: 4px 8px; border-radius: 8px; }
    .row, body.touch .row { margin: 1px 0; font-size: 9px; gap: 5px; }
    .row span { width: 44px; }
    .bar { height: 6px; }
    #weapon { font-size: 11px; }
    .mute-wrap { top: calc(max(6px, env(safe-area-inset-top)) + 84px); right: max(8px, env(safe-area-inset-right)); display: flex; gap: 4px; }
    #mute, #quit { margin: 0; font-size: 10px; padding: 3px 6px; }
    #feed, body.touch #feed { top: 116px; left: max(8px, env(safe-area-inset-left)); font-size: 11px; }
    #countdown { font-size: 56px; }
    #toast { font-size: 18px; }
    #dead { font-size: 15px; }
    #touch .fire-pad { right: max(10px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); transform: scale(.78); transform-origin: right bottom; }
    #stick { left: calc(max(14px, env(safe-area-inset-left)) + 50px); top: calc(100% - max(10px, env(safe-area-inset-bottom)) - 50px); width: 100px; height: 100px; margin: -50px 0 0 -50px; }
    #stick-zone .hint { left: max(14px, env(safe-area-inset-left)); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 104px); font-size: 9px; }
    .card { padding: 12px; width: min(760px, 100%); }
    .card h1 { font-size: 30px; } .card h2 { margin-bottom: 6px; font-size: 20px; }
    #trk, #car { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .trk, .car { padding: 5px 8px; }
    .trk small { display: none; }
    .go { font-size: 18px; padding: 8px 28px; }
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="hud" hidden>
  <div class="top">
    <div class="chip">Круг<b id="lap">1/3</b></div>
    <div class="chip">Место<b id="place">1/4</b></div>
    <div class="chip">Убийства<b id="kills">0</b></div>
    <div class="chip">Время<b id="time">0:00.0</b></div>
    <canvas id="minimap" width="132" height="132"></canvas>
  </div>
  <div class="mute-wrap">
    <button id="mute" type="button">Звук вкл</button>
    <button id="quit" type="button">Выйти</button>
  </div>
  <div id="feed"></div>
  <div id="countdown" hidden></div>
  <div id="toast" hidden></div>
  <div id="dead" hidden></div>
  <div class="bottom">
    <div class="row"><span>Броня</span><div class="bar"><i id="hp"></i></div></div>
    <div class="row"><span>Перегрев</span><div class="bar"><i id="heat"></i></div></div>
    <div class="row"><span>Нитро</span><div class="bar"><i id="nitro"></i></div></div>
    <div class="row"><span>Оружие</span><b id="weapon">—</b></div>
  </div>
</div>

<div id="touch" hidden>
  <div id="stick-zone">
    <span class="hint">Веди пальцем: руль, вниз — тормоз</span>
    <div id="stick"><div id="stick-knob"></div></div>
  </div>
  <div class="fire-pad">
    <button type="button" class="nitro" data-btn="nitro">НИТРО</button>
    <button type="button" class="alt" data-btn="alt" id="alt-btn">РАКЕТА<br>МИНА</button>
    <button type="button" class="fire" data-btn="fire">ОГОНЬ</button>
  </div>
</div>

<div id="overlay">
  <div class="card" id="screen"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
