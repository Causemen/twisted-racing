<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>RUSTMANIA — Боевые гонки пустоши</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1a1410;
    --panel: rgba(28, 20, 15, 0.82);
    --ink: #f3e6d0;
    --muted: #b9a58a;
    --rust: #c4501c;
    --sand: #e3b25f;
    --hp: #d8432a;
    --nitro: #4ea6e8;
    --heat: #e8a33a;
    --line: rgba(243, 230, 208, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1a1410; }
  }
  :root[data-theme="dark"] { --bg: #1a1410; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Russo One', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
  #game, #game canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  [hidden] { display: none !important; }

  /* HUD как телетрансляция: без подложек, текст с тёмной обводкой */
  #hud { position: fixed; inset: 0; pointer-events: none; --ol: 0 0 3px #000, 2px 2px 0 #120a05, -2px 2px 0 #120a05, 2px -2px 0 #120a05, -2px -2px 0 #120a05, 0 2px 0 #120a05, 0 -2px 0 #120a05, 2px 0 0 #120a05, -2px 0 0 #120a05; }
  #hud, #hud button { color: #fff; text-shadow: var(--ol); letter-spacing: .3px; }
  .top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); display: flex; gap: 14px; align-items: flex-start; }
  .place { line-height: .85; font-size: 64px; color: #fff; display: flex; align-items: flex-start; }
  .place.first { color: #ffd23a; }
  .place small { font-size: 22px; margin: 4px 0 0 2px; color: #fff; }
  .stats { display: grid; gap: 1px; font-size: 13px; padding-top: 4px; }
  .stats b { font-weight: 400; font-size: 20px; color: #ffd23a; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .onair-tag { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); font-size: 13px; color: #ff3a24; white-space: nowrap; }
  .onair-tag::first-letter { animation: blink .8s infinite alternate; }
  .onair-tag span { color: #fff; }
  #minimap { margin-left: auto; width: 132px; height: 132px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.6)); }
  .mute-wrap { position: absolute; right: max(14px, env(safe-area-inset-right)); top: calc(max(10px, env(safe-area-inset-top)) + 138px); display: flex; gap: 6px; }
  #mute, #quit { pointer-events: auto; font-family: inherit; font-size: 12px; background: none; border: 2px solid rgba(255,255,255,.75); box-shadow: 0 0 0 1px #120a05, inset 0 0 0 1px #120a05; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  .gauges { position: absolute; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: min(300px, calc(100% - 28px)); display: grid; gap: 5px; }
  .gauge { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 8px; font-size: 14px; }
  .bar { height: 13px; background: rgba(18,10,5,.45); border: 2px solid #120a05; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .bar i { display: block; height: 100%; width: 100%; transition: width .1s; }
  #hp { background: linear-gradient(#ff6a4a, var(--hp)); } #hp.low { animation: blink .4s infinite alternate; }
  #heat { background: linear-gradient(#ffc45a, var(--heat)); } #heat.over { background: #ff2a10; }
  #nitro { background: linear-gradient(#8fd0ff, var(--nitro)); opacity: .55; } #nitro.ready { opacity: 1; }
  #weapon { color: #ffd23a; font-size: 16px; font-weight: 400; }
  @keyframes blink { to { opacity: .35; } }
  #feed { position: absolute; top: 100px; left: max(14px, env(safe-area-inset-left)); font-size: 14px; max-width: 46%; }
  #feed div { margin: 2px 0; } #feed .hl { color: #ffd23a; }
  /* Реплика в эфире: лицо говорящего и текст, выезжает слева, как в меню */
  #say { position: absolute; left: 50%; top: 26px; width: min(560px, calc(100% - 330px)); transform: translateX(-50%); display: flex; gap: 10px; align-items: center; }
  #say img { width: 52px; height: 52px; flex: none; border-radius: 50%; border: 3px solid #ffd23a; box-shadow: 0 0 0 2px #120a05, 0 3px 6px rgba(0,0,0,.5); object-fit: cover; }
  #say div { display: grid; gap: 1px; font-size: 16px; line-height: 1.25; }
  #say b { font-weight: 400; font-size: 12px; color: #ffd23a; text-transform: uppercase; }
  #say.in { animation: sayIn .45s cubic-bezier(.2,.9,.3,1.25) both; }
  #say.out { animation: sayOut .3s ease-in both; }
  @keyframes sayIn { from { transform: translateX(-50%) translateX(-100vw); } to { transform: translateX(-50%); } }
  @keyframes sayOut { to { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
  #countdown { position: absolute; inset: 0; display: grid; place-items: center; font-size: 110px; color: #ffd23a; text-shadow: var(--ol), 0 6px 0 #5a2a10; }
  #toast { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font-size: 30px; color: #ffd23a; white-space: nowrap; }
  #dead { position: absolute; left: 50%; top: 42%; transform: translateX(-50%); font-size: 22px; color: #ff6a4a; white-space: nowrap; }
  body.touch .gauges { top: calc(max(10px, env(safe-area-inset-top)) + 70px); bottom: auto; width: 200px; gap: 3px; }
  body.touch .gauge { grid-template-columns: 62px 1fr; font-size: 11px; }
  body.touch #feed { top: calc(max(10px, env(safe-area-inset-top)) + 160px); }
  @media (max-width: 600px) {
    .top { gap: 8px; } .place { font-size: 48px; } .place small { font-size: 17px; } .stats b { font-size: 16px; } .stats { font-size: 10px; }
    #minimap { width: 96px; height: 96px; } .mute-wrap { top: calc(max(10px, env(safe-area-inset-top)) + 102px); }
    .onair-tag { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 190px); font-size: 11px; }
    #say { top: auto; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 210px); width: calc(100% - 28px); }
    #say div { font-size: 15px; }
  }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(20, 12, 8, 0.6); padding: 16px; }
  #overlay > .card { flex: 0 1 auto; min-height: 0; }
  /* Жорж Блеск: кадр комикса, выезжает сбоку экрана */
  #host { flex: none; width: min(560px, 100%); display: flex; flex-direction: row-reverse; align-items: center; gap: 14px; z-index: 2; pointer-events: none; }
  #host-face { width: 104px; height: 104px; flex: none; object-fit: cover; border: 4px solid #ffd23a; border-radius: 6px; outline: 3px solid #111; box-shadow: 6px 6px 0 #111; transform: rotate(-4deg); background: #3a2a1e; }
  #host .bubble { flex: 1; min-height: 0; background: #fff; color: #111; border: 3px solid #111; border-radius: 22px; box-shadow: 5px 5px 0 #111; padding: 12px 16px 12px;
    font-family: 'Russo One', system-ui, sans-serif; font-size: 18px; line-height: 1.25; text-align: left; transform-origin: left center; }
  #host .bubble b { justify-self: start; font-size: 13px; color: #111; background: #ffd23a; border: 2px solid #111; padding: 1px 8px; transform: rotate(-2deg); margin: -4px 0 4px -4px; text-transform: uppercase; letter-spacing: .5px; }
  #host .bubble::before, #host .bubble::after { content: ''; position: absolute; top: 50%; border-style: solid; border-color: transparent; }
  #host .bubble::before { left: -19px; margin-top: -12px; border-width: 12px 19px 12px 0; border-right-color: #111; }
  #host .bubble::after { left: -13px; margin-top: -8px; border-width: 8px 13px 8px 0; border-right-color: #fff; }
  #host.in { animation: hostIn .6s cubic-bezier(.2,.9,.3,1.25) both; }
  #host.out { animation: hostOut .26s ease-in both; }
  #host.pop .bubble { animation: pop .35s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes hostIn { from { transform: translateX(-110vw) rotate(-6deg); } 75% { transform: translateX(10px) rotate(1deg); } to { transform: none; } }
  @keyframes hostOut { to { transform: translateX(-110vw) rotate(-6deg); } }
  @keyframes pop { from { transform: scale(.7); } 60% { transform: scale(1.05); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { #host.in, #host.out, #host.pop .bubble { animation: none; } }
  @media (max-width: 420px) { #host-face { width: 84px; height: 84px; } #host .bubble { font-size: 15px; padding: 10px 12px; } }
  /* Широкий экран: Жорж стоит в углу, слева от меню */
  @media (min-width: 1000px) and (min-height: 560px) {
    #host { position: fixed; left: 24px; bottom: 24px; width: calc((100vw - 560px) / 2 - 40px); max-width: 380px; flex-direction: column; align-items: flex-start; gap: 22px; }
    #host-face { width: 170px; height: 170px; }
    #host .bubble { font-size: 21px; padding: 14px 18px; }
    #host .bubble::before { top: auto; bottom: -19px; left: 40px; margin: 0; border-width: 19px 6px 0 18px; border-color: #111 transparent transparent transparent; }
    #host .bubble::after { top: auto; bottom: -12px; left: 44px; margin: 0; border-width: 13px 4px 0 12px; border-color: #fff transparent transparent transparent; }
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; width: min(560px, 100%); max-height: 100%; overflow-y: auto; text-align: center; backdrop-filter: blur(4px); }
  h1 { margin: 0 0 4px; font-size: clamp(34px, 9vw, 52px); font-weight: 400; color: var(--sand); letter-spacing: 1px; text-shadow: 0 3px 0 #6a2a10; }
  h2 { margin: 0 0 12px; font-weight: 400; color: var(--sand); }
  .muted { color: var(--muted); font-size: 14px; line-height: 1.5; }
  .keys { text-align: left; font-size: 14px; color: var(--muted); margin: 16px 0; line-height: 1.8; }
  kbd { background: rgba(255,255,255,0.1); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--ink); font-family: inherit; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 15px; }
  td, th { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 400; font-size: 12px; }
  tr.me td { color: var(--sand); }
    .car { font-family: inherit; text-align: left; color: var(--ink); background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-left: 6px solid var(--car); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
  .car b { font-weight: 400; font-size: 15px; }
  .car small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; margin-bottom: 2px; }
  .car.on { border-color: var(--sand); border-left-color: var(--car); background: rgba(227,178,95,0.12); }
  .car:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
  .stat span { width: 58px; }
  .stat i { flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--sand) var(--v), rgba(255,255,255,0.1) var(--v)); }

  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  h3 { margin: 14px 0 6px; font-weight: 400; font-size: 14px; color: var(--muted); text-align: left; letter-spacing: .5px; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .head h2 { margin: 0; }
  .back, .btn2 { font-family: inherit; font-size: 14px; color: var(--ink); background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .back { padding: 6px 10px; font-size: 12px; }
  .btn2.danger { color: var(--muted); font-size: 12px; }
  .go.sm, .btn2.sm { font-size: 13px; padding: 8px 12px; margin: 0; box-shadow: none; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: default; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .menu { display: grid; gap: 10px; margin: 16px 0; }
  .big { font-family: inherit; font-size: 22px; color: #fff; background: var(--rust); border: 0; border-radius: 12px; padding: 14px; cursor: pointer; box-shadow: 0 4px 0 #6a2a10; display: grid; gap: 2px; }
  .big.alt { background: rgba(255,255,255,0.08); box-shadow: 0 4px 0 rgba(0,0,0,0.35); color: var(--ink); }
  .big small { font-size: 12px; font-family: system-ui, sans-serif; opacity: .8; }
  .ver { color: var(--muted); font-size: 11px; margin: 4px 0 0; }
  .gang, .trk, .car { font-family: inherit; text-align: left; color: var(--ink); background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; display: grid; gap: 3px; }
  .gang, .car { border-left: 6px solid var(--car); }
  .gang b, .trk b, .car b { font-weight: 400; font-size: 15px; }
  .gang small, .trk small, .car small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .gang em { color: var(--sand); font-size: 11px; font-family: system-ui, sans-serif; }
  .trk.on, .car.on { border-color: var(--sand); background: rgba(227,178,95,0.12); }
  .car.on { border-left-color: var(--car); }
  .gang:hover, .trk:hover, .car:hover { background: rgba(255,255,255,0.08); }
  .gang:focus-visible, .trk:focus-visible, .car:focus-visible, .big:focus-visible, .go:focus-visible, .btn2:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
  .quote { margin: 12px 0; text-align: left; background: rgba(255,255,255,0.05); border-left: 3px solid var(--sand); border-radius: 0 8px 8px 0; padding: 10px 12px; }
  .quote blockquote { margin: 0; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.45; color: var(--ink); }
  .quote figcaption { margin-top: 4px; font-size: 12px; color: var(--sand); }
  .bank { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); margin: 6px 0; }
  .bank b { color: var(--ink); font-weight: 400; font-size: 16px; margin-left: 4px; }
  .terrs, .upgs { display: grid; gap: 8px; margin-top: 10px; text-align: left; }
  .terr, .upg { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-left: 6px solid var(--car, var(--sand)); border-radius: 10px; padding: 8px 10px; }
  .terr > div, .upg > div { min-width: 0; display: grid; gap: 2px; }
  .terr b, .upg b { font-weight: 400; font-size: 15px; }
  .terr small, .upg small { color: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .terr.final { border-color: var(--sand); }
  .pips { display: flex; gap: 4px; margin-top: 2px; }
  .pips i { width: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.14); }
  .pips i.boss { width: 22px; }
  .pips i.done { background: var(--sand); }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 4px; font-family: system-ui, sans-serif; vertical-align: 2px; }
  .tag.ok { background: #3c6a2c; color: #e8f5d8; }
  .tag.bad { background: #5a4a40; color: #e8d8c8; }
  .tag.warn { background: #b0301a; color: #fff; }
  .warn-text { color: #ff9a70; font-size: 13px; font-family: system-ui, sans-serif; }
  .small { font-size: 12px; }
  .opp { list-style: none; padding: 0; margin: 0; text-align: left; display: grid; gap: 4px; font-size: 14px; }
  .opp small { color: var(--muted); font-family: system-ui, sans-serif; font-size: 11px; margin-left: 4px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .tbl { overflow-x: auto; }
  .fuel { display: grid; gap: 2px; margin: 10px auto; max-width: 280px; font-size: 13px; color: var(--muted); }
  .fuel div { display: flex; justify-content: space-between; }
  .fuel b { color: var(--sand); font-weight: 400; font-variant-numeric: tabular-nums; }
  .fuel .sum { border-top: 1px solid var(--line); padding-top: 4px; color: var(--ink); }
  @media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } .terr, .upg { flex-wrap: wrap; } }
  .keys { margin: 10px 0; }
  @media (max-width: 420px) { .card { padding: 14px; } .keys { display: none; } }
  @media (max-height: 800px) { .keys { font-size: 12px; line-height: 1.55; margin: 6px 0; } h1 { font-size: 36px; } .card .muted { margin: 4px 0; } }
  .card .keys.howto { display: block; font-size: 14px; line-height: 1.6; }
  .howto > div { margin-bottom: 8px; } .howto b { color: var(--sand); font-weight: 400; }
  /* Главное меню: заставка шоу «Горячий эфир» */
  .onair { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  .live { color: #fff; background: #c81e10; border-radius: 4px; padding: 2px 8px 2px 18px; position: relative; }
  .live::before { content: ''; position: absolute; left: 7px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: #fff; animation: blink .8s infinite alternate; }
  h1.logo { margin: 8px auto 6px; line-height: 0; }
  h1.logo img { width: min(440px, 100%); height: auto; filter: drop-shadow(0 4px 0 rgba(0,0,0,.35)); }
  .bubble { position: relative; flex: 1; min-height: 64px; background: #f3e6d0; color: #241812; border-radius: 12px; padding: 8px 12px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.35; display: grid; align-content: center; gap: 2px; }
  .bubble b { font-family: 'Russo One', system-ui, sans-serif; font-weight: 400; font-size: 12px; color: var(--rust); }
  .menu .btn2 { justify-self: center; }
  .faces-title { text-align: center; margin: 4px 0 6px; }
  .faces { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .face { font-family: inherit; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; display: grid; justify-items: center; gap: 3px; font-size: 10px; }
  .face img { width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 50%; border: 3px solid var(--car); object-fit: cover; background: #3a2a1e; transition: transform .15s; }
  .face span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .face:hover img, .face.on img { transform: scale(1.08); }
  .face.on span { color: var(--sand); }
  .face:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; border-radius: 8px; }
  .ticker { margin: 12px -20px 0; overflow: hidden; background: #c81e10; color: #fff; font-family: system-ui, sans-serif; font-size: 13px; padding: 5px 0; white-space: nowrap; }
  .ticker > div { display: inline-block; animation: ticker 70s linear infinite; }
  .ticker span { margin: 0 4px; } .ticker i { font-style: normal; color: #ffd23a; margin: 0 10px; }
  @keyframes ticker { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { .ticker > div, .live::before { animation: none; } }
  @media (max-width: 420px) { .ticker { margin: 10px -14px 0; } }
  /* Портреты: банды, вступление, цитаты, карта */
  .gangs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .gangs .gang { grid-template-rows: auto 1fr; padding: 0; overflow: hidden; border: 2px solid var(--line); border-top: 4px solid var(--car); gap: 0; align-content: start; }
  .gangs .gang img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #3a2a1e; transition: transform .2s; }
  .gangs .gang:hover img { transform: scale(1.04); }
  .gangs .gang:hover, .gangs .gang:focus-visible { border-color: var(--car); }
  .gang-body { display: grid; gap: 2px; padding: 8px 10px 10px; position: relative; background: rgba(28,20,15,.9); }
  .gang-body .lead { color: var(--car); font-family: 'Russo One', system-ui, sans-serif; font-size: 13px; }
  .join { display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 14px; align-items: start; text-align: left; margin-top: 8px; }
  .join > img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 3px solid var(--car); box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .join .bubble::before { display: none; }
  .join .bubble { min-height: 0; }
  .join .muted { margin: 10px 0 0; }
  .join .hl { color: var(--sand); font-weight: 400; }
  .join .row { justify-content: flex-start; }
  .quote.has-face { display: flex; gap: 10px; align-items: flex-start; }
  .quote.has-face > img { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid var(--sand); object-fit: cover; }
  .tface { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 2px solid var(--car); object-fit: cover; }
  .terr > div { flex: 1; }
  @media (max-width: 600px) {

  /* Пауза и настройки */

  .cr-place span { font-family: 'Russo One', system-ui, sans-serif; font-size: 22px; text-transform: uppercase; }
  .cr-line { font-family: system-ui, sans-serif; font-size: 15px; margin: 4px 0 0; }

  .tbl tbody tr { animation: crRow .4s both; animation-delay: calc(.5s + var(--i, 0) * .12s); }

  @media (max-height: 500px) { .cr-place b { font-size: 44px; } .credits { margin: 0; } .cr-line { font-size: 13px; } }
  .row.tight { margin-top: 0; gap: 8px; }
  body:has(#pause:not([hidden])) #touch { display: none; }
  /* Размер сенсорных кнопок */
  body { --btn-k: 1; --pad-k: 1; }

  @media (max-height: 500px) {
    .top { top: max(6px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); gap: 8px; }

    #mute, #quit { font-size: 10px; padding: 2px 6px; }

<body>
<div id="game"></div>

<div id="hud" hidden>
  <div class="top">
    <div class="place" id="place-box"><span id="place">1</span><small id="place-n">/4</small></div>
    <div class="stats">
      <div>КРУГ<b id="lap">1/3</b></div>
      <div>ВРЕМЯ<b id="time">0:00.0</b></div>
      <div>УБИЙСТВА<b id="kills">0</b></div>
    </div>
    <canvas id="minimap" width="264" height="264"></canvas>
  </div>
  <div class="onair-tag">● ПРЯМОЙ ЭФИР <span>«ГОРЯЧИЙ ЭФИР»</span></div>
  <div id="say" hidden><img id="say-face" alt=""><div><b id="say-who"></b><span id="say-line"></span></div></div>
  <div class="mute-wrap">
    <button id="mute" type="button">Звук вкл</button>
    <button id="quit" type="button" aria-label="Пауза">❚❚ Пауза</button>
  </div>
  <div id="feed"></div>
  <div id="countdown" hidden></div>
  <div id="toast" hidden></div>
  <div id="fx"></div>
  <div id="dead" hidden></div>
  <div class="gauges">
    <div class="gauge"><span>БРОНЯ</span><div class="bar"><i id="hp"></i></div></div>
    <div class="gauge"><span>ПЕРЕГРЕВ</span><div class="bar"><i id="heat"></i></div></div>
    <div class="gauge"><span>НИТРО</span><div class="bar"><i id="nitro"></i></div></div>
    <div class="gauge"><span>ОРУЖИЕ</span><b id="weapon">—</b></div>
  </div>
</div>

<div id="touch" hidden>
  <div id="stick-zone">
    <span class="hint">Веди пальцем: руль, вниз — тормоз</span>
    <div id="stick"><div id="stick-knob"></div></div>
  </div>
  <div class="fire-pad">
    <button type="button" class="nitro" data-btn="nitro">НИТРО</button>
    <button type="button" class="alt" data-btn="alt" id="alt-btn">РАКЕТА<br>МИНА</button>
    <button type="button" class="fire" data-btn="fire">ОГОНЬ</button>
  </div>
</div>

<div id="pause" hidden><div class="card" id="pause-box"></div></div>

<div id="overlay">
  <div id="host" hidden>
    <div class="bubble"><b id="host-who"></b><span id="host-line"></span></div>
    <img id="host-face" src="art/face-host.webp" alt="">
  </div>
  <div class="card" id="screen"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
